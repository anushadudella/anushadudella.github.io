<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Resume | Anusha Dudella</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;color:#1a1a18;background:linear-gradient(150deg,#EBF0E3,#FDFAF6 55%,#F8ECEE);font-family:Arial,sans-serif;min-height:100vh}nav{padding:24px;text-align:center}a{color:#596c42}nav a{margin:0 14px;text-decoration:none}main{padding:40px 20px}.card{margin:5vh auto 0;max-width:440px;padding:40px 32px;border:1px solid #e2dcd0;border-radius:24px;background:#ffffff99;text-align:center}h1{font-family:Georgia,serif;font-size:30px;font-weight:400;margin:12px 0}p{color:#66665a;line-height:1.6}label{display:block;text-align:left;font-size:14px;margin:24px 0 8px}input,button,.download{font:inherit;padding:14px 20px;border-radius:24px}input{width:100%;border:1px solid #c7c9bf;background:#fff}button,.download{border:0;background:#718158;color:white;cursor:pointer;text-decoration:none}button{margin-top:16px;width:100%}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #9a6880;outline-offset:4px}#status{min-height:24px;font-size:14px}#viewer{max-width:1000px;margin:auto}#viewer[hidden],.card[hidden]{display:none}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.toolbar button{width:auto;margin:0;background:#e9e5dc;color:#333}iframe{width:100%;height:78vh;border:1px solid #e2dcd0;border-radius:12px;background:white}.flower{font-size:28px;color:#b9808a}@media(max-width:480px){main{padding:20px 16px}.card{padding:30px 24px}nav a{margin:0 10px}}
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="/">home</a><a href="/about">about</a><a href="/work">work</a><a href="/resume/" aria-current="page">resume</a></nav>
  <main>
    <section class="card" id="gate">
      <div class="flower" aria-hidden="true">✿</div><h1>Resume access</h1><p>Enter the password to view my resume.</p>
      <form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required aria-describedby="status"><button id="submit" type="submit">View resume ↗</button><p id="status" role="status" aria-live="polite"></p></form>
    </section>
    <section id="viewer" hidden aria-label="Resume">
      <div class="toolbar"><a id="download" class="download" download="Anusha_Dudella_Resume.pdf">Download resume</a><button id="lock" type="button">Lock resume</button></div>
      <p>If the preview isn’t supported by your browser, use Download resume.</p>
      <iframe id="pdf" title="Anusha Dudella’s resume"></iframe>
    </section>
  </main>
  <script type="module" src="./unlock.js"></script>
</body>
</html>
